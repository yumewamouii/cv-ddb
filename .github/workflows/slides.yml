name: slides

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Marp CLI
        run: npm install --global @marp-team/marp-cli@4

      - name: Build HTML
        run: marp --html --allow-local-files "01l_Введение_в_РБД.md" -o slides.html

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp slides.html _site/index.html
          cp -r pic _site/

      - uses: actions/upload-artifact@v4
        with:
          name: slides
          path: |
            slides.html
            pic/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
