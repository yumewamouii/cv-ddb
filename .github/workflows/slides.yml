name: slides

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7

      # configure-pages не используем: без включённого Pages он падает
      # с "Get Pages site failed". Вместо этого проверяем настройку через API
      # и пропускаем deploy, пока Pages не включён.
      - name: Check Pages status
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "200" ] && jq -e '.build_type == "workflow"' /tmp/pages.json >/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages не включён. Settings → Pages → Source: GitHub Actions. Deploy пропущен."
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Marp CLI
        run: npm install --global @marp-team/marp-cli@4

      - name: Build HTML
        run: marp --html --allow-local-files "01l_Введение_в_РБД.md" -o slides.html

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp slides.html _site/index.html
          cp -r pic _site/

      - uses: actions/upload-artifact@v7
        with:
          name: slides
          path: |
            slides.html
            pic/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
